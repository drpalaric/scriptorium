[project]
name = "scriptorium"
version = "0.1.0"
description = "Policy-as-code and control mapping for AI governance: NIST SP 800-53 requirement text to control family."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
