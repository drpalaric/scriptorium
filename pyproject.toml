[project]
name = "scriptorium"
version = "0.1.0"
description = "Policy-as-code and control mapping for AI governance: NIST SP 800-53 requirement text to control family."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]
web = [
    "fastapi>=0.162.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
